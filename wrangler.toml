name = "flopwatch"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = false

# Self-hosted fonts (OFL), served before the Worker runs.
[assets]
directory = "./public"

# Daily: re-queue stale pending_verification, rebuild aggregates, write R2 snapshot, prune.
[triggers]
# 03:17 daily: full maintenance. Every 15 min: queue receipts left pending only because an RPC was not configured.
crons = ["17 3 * * *", "*/15 * * * *"]

[vars]
# Origin that SIWD challenges are bound to. Empty = use the request origin
# (safe on Cloudflare, which routes by host). Set explicitly once a domain exists.
SITE_ORIGIN = ""
# "rpc" in production. "mock" is refused unless ALLOW_MOCK_VERIFIER = "true".
VERIFIER = "rpc"
ALLOW_MOCK_VERIFIER = "false"
# Public HTTP JSON-RPC per network. Testnet stays empty until official docs publish it (SPEC §11.4).
FLOP_RPC_URL_DEVNET = "https://rpc.devnet.flop.network"
# Official: flop.finance/testnet lists wss://testnet.flop.network/ (HTTPS JSON-RPC on the same host); genesis 0x918abd58…cfd800 checked.
FLOP_RPC_URL_TESTNET = "https://testnet.flop.network"
# Explorer URL templates, {hash} / {address} placeholders. Empty = no links. Do not invent.
EXPLORER_TX_URL_DEVNET = "https://explorer.devnet.flop.network/transactions/{hash}"
EXPLORER_TX_URL_TESTNET = "https://testnet.flopscan.io/transactions/{hash}"
EXPLORER_ACCOUNT_URL_DEVNET = "https://explorer.devnet.flop.network/account/{address}"
EXPLORER_ACCOUNT_URL_TESTNET = "https://testnet.flopscan.io/account/{address}"
# Official FLOPScan markets surface (FRCR, curve, readiness, reliability). Linked, never re-hosted.
FLOPSCAN_MARKETS_URL_TESTNET = "https://testnet.flopscan.io/markets?tab=reliability"
# Leave empty until a per-miner reliability path is published and returns 200. {address} placeholder.
FLOPSCAN_MINER_RELIABILITY_URL_TESTNET = ""
CHALLENGE_TTL_SECONDS = "300"
SESSION_TTL_SECONDS = "1800"
RATE_LIMIT_SUBMIT_HOURLY = "30"
RATE_LIMIT_SUBMIT_DAILY = "200"
RATE_LIMIT_CHALLENGE_HOURLY = "60"
VERIFY_INLINE_TIMEOUT_MS = "2500"
VERIFY_MAX_ATTEMPTS = "12"
# "false" hides the seeded SAMPLE rows (they stay in D1) and shows the real, possibly empty, live board.
SHOW_SAMPLE_DATA = "false"
# Buyer reviews (FLOPWATCH-BUYER-REVIEWS-SPEC §12)
REVIEW_MAX_PER_DID_DAILY = "20"
REVIEW_MAX_PER_BUYER_7D = "10"
REVIEW_FRESHNESS_DAYS = "30"
REVIEW_MIN_N = "5"
REVIEW_BAYES_M = "5"
REVIEW_BAYES_PRIOR = "3"
# Secret (wrangler secret put): SESSION_SIGNING_KEY

[[d1_databases]]
binding = "DB"
database_name = "flop-board"
database_id = "f5a70eee-f3fa-4563-8195-a75d5cc9d2a3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flop-board"

[[kv_namespaces]]
binding = "CACHE"
id = "8773defc6bd84bef9445f41e7a6e8760"

[[queues.producers]]
binding = "VERIFY_QUEUE"
queue = "flop-board-verify"

[[queues.consumers]]
queue = "flop-board-verify"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 10

[observability]
enabled = true
